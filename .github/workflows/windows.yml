name: Windows build and safety checks
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build DisplayQuickControl.sln -c Release
      - run: dotnet run --project tests/DisplayQuickControl.Tests -c Release -- tests/ColorControl.Fixture/bin/Release/net10.0/ColorControl.exe
      - run: dotnet run --project tests/DisplayQuickControl.WindowsSmoke -c Release
      - run: dotnet publish DisplayQuickControl -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o artifacts/win-x64
      - run: dotnet publish DisplayQuickControl -c Release -r win-arm64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o artifacts/win-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: DisplayQuickControl-Windows
          path: artifacts/
